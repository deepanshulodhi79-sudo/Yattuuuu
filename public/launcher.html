<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Mail Launcher</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Paste kiye gaye text ka bold look barkarar rakhne ke liye design */
  .rich-text-box {
    width: 100%;
    height: 150px;
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 4px;
    background: #fff;
    overflow-y: auto;
    box-sizing: border-box;
    text-align: left;
    color: #000;
    font-family: inherit;
    font-size: inherit;
  }
  
  /* Textbox khali hone par placeholder dikhane ke liye */
  .rich-text-box:empty:before {
    content: attr(placeholder);
    color: #888;
  }
</style>
</head>
<body>
<div class="form-grid">
  <h2>📧 Fast Mail Launcher</h2>

  <div class="grid-row">
    <input id="senderName" placeholder="Sender Name">
    <input id="email" placeholder="Your Gmail">
  </div>

  <div class="grid-row">
    <input id="pass" type="password" placeholder="App Password">
    <input id="subject" placeholder="Subject">
  </div>

  <div class="grid-row">
    <div id="message" class="rich-text-box" contenteditable="true" placeholder="Message Body (Paste Bold Text Here...)"></div>
    <textarea id="recipients" placeholder="Recipients (comma or newline)"></textarea>
  </div>

  <div class="grid-row">
    <button id="sendBtn">Send All</button>
    <button onclick="logout()">Logout</button>
  </div>

  <p id="statusMessage"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
